name: Backend CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

# Tự động hủy job đang chạy nếu có commit mới được push lên cùng branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend (Test & Package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ensure Maven Wrapper is executable
        run: chmod +x mvnw

      - name: Run Tests
        run: ./mvnw clean test

      - name: Package Application (JAR)
        run: ./mvnw -B package -DskipTests

      - name: Upload Build Artifact (JAR)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: backend-jar
          path: Backend/target/*.jar
          retention-days: 7

      - name: Upload Test Reports (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: surefire-reports
          path: Backend/target/surefire-reports/
          retention-days: 5
