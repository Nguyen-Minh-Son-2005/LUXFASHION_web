spring.application.name=Backend-Test

# Cấu hình H2 in-memory database phục vụ test (không cần MySQL thật)
spring.datasource.url=jdbc:h2:mem:luxfashion;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Dummy credentials cho OAuth2 Client trong môi trường Test
spring.security.oauth2.client.registration.google.client-id=dummy-test-client-id
spring.security.oauth2.client.registration.google.client-secret=dummy-test-client-secret
spring.security.oauth2.client.registration.google.scope=profile,email

app.baseUrl=http://localhost:8080
server.servlet.session.cookie.same-site=Lax
