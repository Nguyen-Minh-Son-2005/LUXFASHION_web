name: Frontend CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'Admin-frontend/**'
      - 'User-fontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'Admin-frontend/**'
      - 'User-fontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

# Tự động hủy job đang chạy nếu có commit mới được push lên cùng branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-frontend:
    name: Admin Frontend (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Admin-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Admin-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests (nếu có)
        run: npm test --if-present

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: admin-frontend-dist
          path: Admin-frontend/dist
          retention-days: 7

  user-frontend:
    name: User Frontend (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: User-fontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: User-fontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests (nếu có)
        run: npm test --if-present

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: user-frontend-dist
          path: User-fontend/dist
          retention-days: 7
